# WildRobot v0.21.0-17d45: retention-balanced failure-state replay.
#
# The frozen 17d38 campaign champion remains checkpoint 3: its authoritative
# deterministic screen has 1/64 falls, 0.09773 m/s forward velocity, 0.05135
# m/s command error, 0.08685 m touchdown stride, 3.83/9.48 deg stable
# mean/max tilt, and 11.54% stable left-hip-roll saturation.
#
# The exact 2f857095 failure diagnostic reproduced 3/64 early falls at
# 1.66-2.16 s. All three trajectories collapsed backward from home resets and
# reached 41.80-49.74 deg trace peak tilt. At the first -0.15 rad pitch
# crossing, actor-observed pitch rates were -0.31 to -0.65 rad/s. The
# evaluator's authoritative final-0.5-second saturation occupancy was only
# 2.67% overall (an isolated left-knee event in one fall), and terminal
# saturation was 0%; the per-case 1.0 values are instantaneous maxima anywhere
# in each two-second trace. This identifies closed-loop state-distribution
# shift, not torque exhaustion, as the dominant failure.
#
# The first DAgger attempt did fit its 221 failure states: action RMSE fell
# from 0.04224 to 0.01095. But repeating them 64 times made 14,144/46,144 =
# 30.65% of the supervised set, while ordinary validation RMSE increased
# 33.9x from 0.000168 to 0.005702; its safety-best child then regressed to
# 5/64 falls. The measured recovery-reset child also missed the champion with
# 2/64 falls. This experiment tests one narrower causal hypothesis: replay
# oversampling displaced the champion's normal gait.
#
# Single intervention family: failure_state_replay. Use the fresh 222-state
# trace from the authoritative diagnostic, but repeat it 16 rather than 64
# times. The resulting 3,552 targeted labels are 9.99% of the 35,552-sample
# set, while the unchanged 32,000 champion self-labels preserve normal gait.
# Ten supervised epochs, the <=0.02 ordinary/failure action-RMSE gate, and five
# source-KL-guarded PPO iterations are unchanged. The config-managed bootstrap
# owns initialization, so the GPU job must not receive --init-policy/--resume.
#
# Contacts reconstruct only the simulation teacher's v8 input and remain
# absent from the deployed wr_obs_v11_cmd3d_proprio actor. Rewards,
# environment/reference behavior, command sampling, geometry, action scale,
# 20 ms control timing, and deployment sensors exactly match the champion.
#
# Sampler/reward pre-flight: 17d43 env/velocity_cmd averaged 0.093751 m/s,
# 3.85% below the raw [0.065, 0.13] midpoint and 1.22% above the 0.092625 m/s
# expectation after the 5% exact-zero mixture. The scalar sampler is healthy.
# Alive, command, torso-quaternion, angular-rate, action-rate, pose,
# close-feet, feet-phase, feet-orientation, torque, and saturation terms were
# all logged; no reward is missing.
#
# ToddlerBot comparison: local commit f81679b keeps contact/stance signals in
# rewards and privileged observations, not the actor, while using 15-frame
# actor history and one-step action delay. This replay preserves that deployed
# sensor contract. It is a training-only WR safety intervention, so no
# robot-size, speed, geometry, cadence, or timing normalization changes.
# References: Ross et al., DAgger (AISTATS 2011,
# https://proceedings.mlr.press/v15/ross11a.html); Rusu et al., Policy
# Distillation (arXiv:1511.06295); Shi et al., ToddlerBot
# (arXiv:2502.00893), local ToddlerBot commit f81679b.

