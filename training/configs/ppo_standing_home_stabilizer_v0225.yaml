# =============================================================================
# WildRobot PPO Standing Home Stabilizer v0.22.5
# =============================================================================
# Fresh training after standardizing the simulation/hardware contract on wxyz:
#   - actor remains the 59-value, contact-free v0.22.3 contract;
#   - reset roll/pitch covers ToddlerBot's default +/-0.1 rad range;
#   - modest IMU noise and one control-step latency improve transfer coverage.
#
# Usage:
#   uv run python training/train.py \
#     --config training/configs/ppo_standing_home_stabilizer_v0225.yaml --verify
# =============================================================================
version: "0.22.5"
version_name: "Standing stabilizer with corrected quaternion contract"

seed: 42

env:
  assets_root: assets/v2

  sim_dt: 0.002
  ctrl_dt: 0.02
  # 20 s at 50 Hz. This stays within the 1,104-frame offline reference;
  # promotion uses the same uninterrupted horizon.
  max_episode_steps: 1000

  target_height: 0.46
  min_height: 0.40
  max_height: 0.70
  max_pitch: 0.8
  max_roll: 0.8
  torso_pitch_soft_min_rad: -0.15
  torso_pitch_soft_max_rad: 0.15
  torso_roll_soft_min_rad: -0.10
  torso_roll_soft_max_rad: 0.10
  min_feet_y_dist: 0.171
  max_feet_y_dist: 0.317

  min_velocity: 0.0
  max_velocity: 0.0
  min_velocity_y: 0.0
  max_velocity_y: 0.0
  max_yaw_rate: 0.0
  eval_velocity_cmd: [0.0, 0.0, 0.0]

  contact_threshold_force: 5.0
  foot_switch_threshold: 2.0

  actor_obs_layout_id: wr_obs_v9_standing
  action_mapping_id: pos_target_home_025_v1
  action_filter_alpha: 0.6
  action_delay_steps: 1
  policy_excluded_actuator_names:
    - left_wrist_yaw
    - left_wrist_pitch
    - right_wrist_yaw
    - right_wrist_pitch

  loc_ref_version: v3_offline_library
  loc_ref_residual_mode: absolute
  loc_ref_residual_base: home
  loc_ref_penalty_pose_anchor: home
  loc_ref_penalty_feet_ori_form: tb_linear_lateral
  loc_ref_feet_phase_zero_on_standing: false
  close_feet_threshold: 0.146
  penalty_pose_weight_default: 0.0
  penalty_pose_weights_per_joint:
    left_hip_pitch: 0.01
    right_hip_pitch: 0.01
    left_hip_roll: 1.0
    right_hip_roll: 1.0
    left_knee_pitch: 0.01
    right_knee_pitch: 0.01
    left_ankle_pitch: 5.0
    right_ankle_pitch: 5.0
    left_ankle_roll: 5.0
    right_ankle_roll: 5.0

  push_enabled: true
  push_start_step_min: 40
  push_start_step_max: 250
  push_duration_steps: 6
  push_force_min: 2.0
  push_force_max: 5.0
  push_body: waist

  # Match ToddlerBot's default reset orientation coverage. The hardware log
  # entered the policy at +5.6 deg pitch, inside this +/-5.73 deg range.
  reset_torso_roll_range: [-0.1, 0.1]
  reset_torso_pitch_range: [-0.1, 0.1]

  # Conservative white-noise coverage plus the observed occasional 20 ms
  # hardware sample reuse, without changing the observation contract.
  imu_gyro_noise_std: 0.015
  imu_quat_noise_deg: 0.25
  imu_latency_steps: 1

  # Independent body/joint samples expose the policy to asymmetric physical
  # dynamics without creating a permanent preferred side.
  domain_randomization_enabled: true
  domain_rand_friction_range: [0.4, 1.0]
  domain_rand_mass_scale_range: [0.9, 1.1]
  domain_rand_kp_scale_range: [0.9, 1.1]
  domain_rand_frictionloss_scale_range: [0.8, 1.2]
  domain_rand_joint_offset_rad: 0.03
  domain_rand_backlash_range: [0.02, 0.10]
  domain_rand_backlash_activation: 0.1

ppo:
  num_envs: 1024
  rollout_steps: 128
  iterations: 100

  learning_rate: 3e-4
  gamma: 0.99
  gae_lambda: 0.95

  clip_epsilon: 0.2
  entropy_coef: 0.0005
  value_loss_coef: 0.5

  epochs: 4
  num_minibatches: 32
  max_grad_norm: 0.5
  log_interval: 10

  # Contact forces, actuator force and expected stance are training-only.
  critic_privileged_enabled: true
  critic_includes_actor_obs: false
  eval:
    enabled: false
    deterministic: true
    reset_perturb_pose: true
    post_training_enabled: true
    post_training_task: standing
    post_training_top_k: 3
    post_training_num_envs: 16
    post_training_num_steps: 1000
    post_training_checkpoint_label: standing_eval_promoted

networks:
  actor:
    hidden_sizes: [256, 256, 128]
    activation: elu
    log_std_init: -1.0
    min_log_std: -5.0
    max_log_std: 2.0

  critic:
    hidden_sizes: [256, 256, 128]
    activation: elu

reward_weights:
  alive: 1.0
  ref_body_quat_track: 2.5
  torso_pos_xy: 1.0
  torso_pos_xy_alpha: 50.0
  ang_vel_xy: 1.0
  torso_pitch_soft: 1.0
  torso_roll_soft: 1.0

  # The offline library's contact mask alternates for walking, so it is not a
  # valid standing target. The explicit term below instead requires both feet.
  ref_contact_match: 0.0
  standing_support_balance: 1.0
  standing_support_balance_alpha: 4.0

  penalty_pose: -0.5
  penalty_close_feet_xy: 10.0
  penalty_feet_ori: 5.0
  feet_phase: 7.5
  feet_phase_alpha: 914.304
  feet_phase_swing_height: 0.05

  torque: -0.001
  action_rate: -0.01
  joint_velocity: -0.001
  slip: -0.5

reward:
  task_weight: 1.0
  task_reward_clip: null

checkpoints:
  dir: training/checkpoints
  interval: 10

wandb:
  enabled: true
  project: wildrobot-ppo
  mode: offline
  tags: [ppo, standing, v0225, corrected-quaternion, tilt-reset]

video:
  enabled: true
  episode_length: 500
  width: 640
  height: 480
  fps: 25

quick_verify:
  enabled: false
  ppo:
    num_envs: 4
    rollout_steps: 8
    iterations: 3
    eval:
      post_training_enabled: false
