# WildRobot v0.21.0-17d48: precursor-targeted failure-state replay.
#
# The authoritative 17d47 post-training summary selected no checkpoint. Its
# rank-1 child tied the champion at 1/64 falls but was lexicographically worse:
# stable maximum saturation was 11.2787% versus 11.2716%. The frozen 17d46
# checkpoint 3 therefore remains the campaign champion, with 0.09671 m/s
# forward velocity, 0.05215 m/s command error, 0.08575 m touchdown stride,
# and 3.81/9.21 deg stable mean/max torso tilt.
#
# The independent 64-env diagnostic reproduced 3 non-RSI backward-pitch falls
# at 1.68-2.10 s on friction scales 0.414-0.725. Pitch crossed -0.10 rad near
# 1.04-1.08 s at approximately -0.60 to -0.70 rad/s and reached 42.82-48.97
# deg terminal tilt. The authoritative final-0.5 s and terminal actuator
# saturation occupancies were both 0%; per-case 100% values are instantaneous
# maxima over the full two-second trace. Closed-loop state-distribution shift
# is dominant; 12.41% stable left-hip-roll saturation is secondary.
#
# Earlier full-trace DAgger replay at 16 repeats retained 1/64 falls but raised
# stable saturation to 13.08%. It labeled all 222 reconstructable states,
# including the normal pre-precursor prefix, at 9.99% of the supervised set;
# ordinary validation RMSE reached 0.004516. This experiment tests one narrower
# hypothesis: relabel only states after the measured backward-pitch precursor.
#
# Single intervention family: failure_state_replay. The config-managed
# bootstrap starts from the frozen 17d46 champion, reconstructs contact-observed
# teacher inputs from the saved simulation trace, and filters target states to
# pitch <= -0.10 rad using the metric from the state before each action. The
# trace yields 112 unique targeted states; 16 repeats contribute 1,792/33,792 =
# 5.30% of the supervised set, while 32,000 champion self-labels retain normal
# gait. The GPU job must not receive --init-policy or --resume.
#
# Contacts are used only to query the frozen simulation teacher and remain
# absent from the deployed wr_obs_v11_cmd3d_proprio actor. Rewards,
# environment/reference behavior, commands, geometry, action scale, 20 ms
# timing, and all deployment sensors remain byte-equal to the champion config.
#
# Sampler/reward pre-flight: 17d47 env/velocity_cmd averaged 0.093012 m/s
# versus the 0.092625 m/s expectation after the 5% exact-zero mixture (0.42%
# high), so the scalar sampler is healthy. Alive, command, torso-quaternion,
# angular-rate, action-rate, pose, close-feet, feet-phase, feet-orientation,
# torque, and saturation rewards were all logged and active; none changes.
#
# ToddlerBot comparison: local commit f81679b keeps stance/contact in
# privileged observations and rewards, while its actor uses IMU/proprioception,
# 15-frame history, one-step action delay, and 0.25-rad action scale. This
# training-only DAgger correction preserves that deployment contract. No
# robot-size, speed, cadence, geometry, or timing parameter changes. References:
# Ross et al., DAgger (AISTATS 2011,
# https://proceedings.mlr.press/v15/ross11a.html); Rusu et al., Policy
# Distillation (arXiv:1511.06295); Shi et al., ToddlerBot
# (arXiv:2502.00893), local ToddlerBot commit f81679b.

